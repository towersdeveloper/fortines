name: Compilar Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: fortines-app

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fortines-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar el juego al proyecto Android
        run: npx cap sync android

      - name: Preparar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto ANDROID_KEYSTORE_BASE64. El AAB sale sin firmar."
          fi

      - name: Compilar APK de prueba y AAB
        working-directory: fortines-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Renombrar archivos
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/debug/app-debug.apk "salida/fortines-prueba-v${VERSION_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "salida/fortines-v${VERSION_NAME}.aab"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: fortines-apk-v${{ env.VERSION_NAME }}
          path: fortines-app/salida/*.apk

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: fortines-aab-v${{ env.VERSION_NAME }}
          path: fortines-app/salida/*.aab

      - name: Publicar versión de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" salida/* \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "Fortines v${VERSION_NAME} (prueba)" \
            --notes "APK de prueba y AAB para Google Play."
